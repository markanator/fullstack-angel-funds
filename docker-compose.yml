services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: angel_funds
      POSTGRES_PASSWORD: angel_funds
      POSTGRES_DB: angel_funds
    volumes:
      - angel_pg_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - angel_redis_data:/data

volumes:
  angel_pg_data:
  angel_redis_data:
